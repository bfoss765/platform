[workspace]

resolver = "2"

# `third_party/rust-dashcore` is a self-contained, separately-`[workspace]`-rooted
# vendored copy of the pinned rust-dashcore rev (see the `[patch]` table at the
# end of this file). Exclude it so it is never treated as a member of THIS
# workspace — it is only referenced through `[patch]` path overrides.
exclude = ["third_party/rust-dashcore"]

members = [
    "packages/dapi-grpc",
    "packages/rs-dash-platform-macros",
    "packages/rs-dpp",
    "packages/rs-drive",
    "packages/rs-platform-value",
    "packages/rs-platform-serialization",
    "packages/rs-platform-serialization-derive",
    "packages/rs-platform-version",
    "packages/rs-platform-versioning",
    "packages/rs-platform-value-convertible",
    "packages/rs-dpp-json-convertible-derive",
    "packages/rs-drive-abci",
    "packages/dashpay-contract",
    "packages/withdrawals-contract",
    "packages/masternode-reward-shares-contract",
    "packages/dpns-contract",
    "packages/data-contracts",
    "packages/rs-drive-proof-verifier",
    "packages/rs-context-provider",
    "packages/rs-sdk-trusted-context-provider",
    "packages/wasm-dpp",
    "packages/wasm-dpp2",
    "packages/rs-dapi-client",
    "packages/rs-dash-async",
    "packages/rs-sdk",
    "packages/strategy-tests",
    "packages/simple-signer",
    "packages/rs-json-schema-compatibility-validator",
    "packages/check-features",
    "packages/wallet-utils-contract",
    "packages/token-history-contract",
    "packages/keyword-search-contract",
    "packages/rs-sdk-ffi",
    "packages/wasm-drive-verify",
    "packages/dash-platform-balance-checker",
    "packages/rs-dapi",
    "packages/rs-dash-event-bus",
    "packages/rs-platform-wallet",
    "packages/rs-platform-wallet-ffi",
    "packages/rs-platform-wallet-storage",
    "packages/rs-platform-encryption",
    "packages/wasm-sdk",
    "packages/rs-unified-sdk-ffi",
    "packages/rs-unified-sdk-jni",
    "packages/rs-scripts",
]

[workspace.dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
dash-network-seeds = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
key-wallet-ffi = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
dash-network = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "1860089eddea27f66e5b3e637d18a73ae138478c" }

tokio-metrics = "0.5"

# Size-tuned profile for the iOS `rs-unified-sdk-ffi` staticlib, which
# otherwise ships huge. Inherits `release` and is ONLY used by the iOS
# build (`build_ios.sh --profile release`)
[profile.release-ios]
inherits = "release"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3

# Debug counterpart for smaller iOS dev builds. Inherits the standard `dev`
# profile (and is ONLY used by the iOS build (`build_ios.sh --profile dev`)
[profile.dev-ios]
inherits = "dev"
panic = "abort"
lto = "thin"

# Android counterparts for the `rs-unified-sdk-jni` cdylib, used ONLY by
# `packages/kotlin-sdk/build_android.sh`. Unlike iOS, panic stays
# `unwind`: a JNI library must never abort the app process — panics are
# caught at the shim boundary and rethrown as Java exceptions.
[profile.release-android]
inherits = "release"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev-android]
inherits = "dev"
strip = "debuginfo"
lto = "thin"

# Optimize heavy crypto crates even in dev/test builds so that
# Halo 2 proof generation and verification run at near-release speed.
# Without this, ZK operations are 10-100x slower (debug field arithmetic).
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.halo2_poseidon]
opt-level = 3
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.grovedb-commitment-tree]
opt-level = 3

[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.halo2_poseidon]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.grovedb-commitment-tree]
opt-level = 3

[workspace.package]

version = "4.0.0"
rust-version = "1.92"

# ---------------------------------------------------------------------------
# TEMPORARY vendoring of the pinned rust-dashcore rev with the asset-lock
# transaction-router fix applied.
#
# The pinned rev 1860089e's `TransactionRouter::get_relevant_account_types(AssetLock)`
# omits `CoinJoin` (and the DashPay accounts), so `check_core_transaction`
# never marks CoinJoin inputs spent when an asset lock spends them — a
# CoinJoin-funded shield's balance re-inflates by the spent amount on every
# rescan (dashpay/platform#4073, dashpay/dash-wallet#1507). The fix lives in
# `third_party/rust-dashcore/key-wallet/.../transaction_router/mod.rs` (a slim,
# separately-workspace-rooted copy of the rev: `.git` and the crates' test
# data are stripped, since cargo only builds the lib target of a patched
# dependency). See `assetlock-router-coinjoin.patch` in the PR for the exact
# upstream diff.
#
# Every crate that resolves from the rust-dashcore git source MUST be patched
# to the same vendored tree — patching only some would split `dashcore` (etc.)
# into two incompatible instances. Remove this whole block once the fix lands
# upstream and the workspace `rev` is bumped past it.
[patch."https://github.com/dashpay/rust-dashcore"]
dashcore = { path = "third_party/rust-dashcore/dash" }
dashcore_hashes = { path = "third_party/rust-dashcore/hashes" }
dashcore-private = { path = "third_party/rust-dashcore/internals" }
dash-network = { path = "third_party/rust-dashcore/dash-network" }
dash-network-seeds = { path = "third_party/rust-dashcore/dash-network-seeds" }
dash-spv = { path = "third_party/rust-dashcore/dash-spv" }
dashcore-rpc = { path = "third_party/rust-dashcore/rpc-client" }
dashcore-rpc-json = { path = "third_party/rust-dashcore/rpc-json" }
git-state = { path = "third_party/rust-dashcore/git-state" }
key-wallet = { path = "third_party/rust-dashcore/key-wallet" }
key-wallet-ffi = { path = "third_party/rust-dashcore/key-wallet-ffi" }
key-wallet-manager = { path = "third_party/rust-dashcore/key-wallet-manager" }
